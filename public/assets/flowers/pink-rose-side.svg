<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="g-side-pink-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f28da5" />
      <stop offset="100%" stop-color="#d45b79" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  
  <!-- Stem curved -->
  <path d="M165 170 Q180 230 160 280" stroke="#5e6b2c" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Sepals (كأس الزهرة) -->
  <path d="M135 160 L145 175 L160 168 L175 175 L180 158 Z" fill="#5e6b2c"/>
  <!-- Side Profile Flower Shape -->
  <g filter="url(#shadow)" transform="translate(150, 115)">
    <!-- Petal layers visible from side -->
    <path d="M-45 35 C-50 -10 -20 -45 10 -40 C35 -35 50 10 40 40 C10 50 -25 48 -45 35 Z" fill="url(#g-side-pink-rose)"/>
    <path d="M-25 30 C-30 -5 -5 -30 20 -25 C38 -15 35 25 20 38 Z" fill="#f28da5" opacity="0.85"/>
    <path d="M-10 20 C-5 5 10 -15 25 -5 C30 10 20 28 5 28 Z" fill="#d45b79" opacity="0.8"/>
  </g>
  
</svg>