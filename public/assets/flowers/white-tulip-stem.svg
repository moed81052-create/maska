<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="g-leaves-white-tulip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fa343" />
      <stop offset="100%" stop-color="#6a7d32" />
    </linearGradient>
  </defs>
  
  
  <!-- Full Stem View -->
  <g transform="translate(150, 150)">
    <!-- Stem main -->
    <line x1="0" y1="-100" x2="0" y2="110" stroke="#6a7d32" stroke-width="10" stroke-linecap="round"/>
    <!-- Bud / Base of flower at top -->
    <path d="M-15 -95 Q0 -115 15 -95 Q0 -85 -15 -95" fill="#ffffff"/>
    <!-- Multiple Foliage Leaves -->
    <path d="M-5 -60 C-40 -80 -80 -70 -75 -40 C-50 -30 -20 -45 0 -55" fill="url(#g-leaves-white-tulip)"/>
    <path d="M5 -30 C40 -50 85 -45 80 -15 C55 -10 25 -20 0 -25" fill="url(#g-leaves-white-tulip)"/>
    <path d="M-5 10 C-45 0 -85 15 -75 40 C-50 45 -20 25 0 15" fill="url(#g-leaves-white-tulip)"/>
    <path d="M5 45 C45 35 75 55 70 80 C45 80 20 60 0 50" fill="url(#g-leaves-white-tulip)"/>
    <!-- Fresh water droplet -->
    <circle cx="-35" cy="-55" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
  
</svg>