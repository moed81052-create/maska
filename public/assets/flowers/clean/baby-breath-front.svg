<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="g-front-baby-breath" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f0fe" />
    </radialGradient>
    <linearGradient id="g-stem-baby-breath" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9e4b" />
      <stop offset="100%" stop-color="#2d3812" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  
  <!-- Stem -->
  <path d="M150 170 Q145 230 152 280" stroke="url(#g-stem-baby-breath)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Leaves -->
  <path d="M148 210 Q110 200 100 220 Q120 230 148 215" fill="#8a9e4b" opacity="0.9"/>
  <path d="M152 230 Q190 225 200 240 Q175 255 152 235" fill="#8a9e4b" opacity="0.9"/>
  <!-- Front Flower Petals -->
  <g filter="url(#shadow)" transform="translate(150, 130)">
    <circle cx="0" cy="0" r="54" fill="url(#g-front-baby-breath)"/>
    <ellipse cx="-20" cy="-15" rx="36" ry="32" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="20" cy="-10" rx="34" ry="32" fill="#e8f0fe" opacity="0.75"/>
    <ellipse cx="0" cy="18" rx="40" ry="28" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="28" fill="url(#g-front-baby-breath)"/>
    <path d="M -12 -5 Q 0 -18 12 -5 Q 0 10 -12 -5" fill="#e8f0fe" opacity="0.95"/>
    <circle cx="0" cy="0" r="8" fill="#ffd166" opacity="0.6"/>
  </g>
  
</svg>