<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="g-top-red-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5eb" />
      <stop offset="40%" stop-color="#d62246" />
      <stop offset="100%" stop-color="#800e26" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  
  <!-- Full top view petals array -->
  <g filter="url(#shadow)" transform="translate(150, 150)">
    <!-- Outer ring of petals -->
    <ellipse cx="0" cy="-65" rx="34" ry="42" fill="#800e26" opacity="0.85"/>
    <ellipse cx="60" cy="-25" rx="34" ry="42" transform="rotate(60 60 -25)" fill="#800e26" opacity="0.85"/>
    <ellipse cx="60" cy="35" rx="34" ry="42" transform="rotate(120 60 35)" fill="#800e26" opacity="0.85"/>
    <ellipse cx="0" cy="65" rx="34" ry="42" fill="#800e26" opacity="0.85"/>
    <ellipse cx="-60" cy="35" rx="34" ry="42" transform="rotate(240 -60 35)" fill="#800e26" opacity="0.85"/>
    <ellipse cx="-60" cy="-25" rx="34" ry="42" transform="rotate(300 -60 -25)" fill="#800e26" opacity="0.85"/>
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="50" fill="url(#g-top-red-rose)"/>
    <!-- Swirl center -->
    <ellipse cx="-5" cy="-8" rx="25" ry="20" fill="#d62246" opacity="0.9"/>
    <ellipse cx="6" cy="5" rx="20" ry="16" fill="#800e26" opacity="0.9"/>
    <circle cx="0" cy="0" r="10" fill="#ffd166"/>
  </g>
  
</svg>