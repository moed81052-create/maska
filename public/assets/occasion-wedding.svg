<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-wedding" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="50%" stop-color="#faebd9"/>
      <stop offset="100%" stop-color="#f5decf"/>
    </linearGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdf4eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa8323"/>
      <stop offset="100%" stop-color="#f7da79"/>
    </linearGradient>
    <linearGradient id="white-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fcf2eb"/>
      <stop offset="100%" stop-color="#e8d5c7"/>
    </linearGradient>
    <linearGradient id="blush-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae1e6"/>
      <stop offset="70%" stop-color="#f0b6c5"/>
      <stop offset="100%" stop-color="#d88497"/>
    </linearGradient>
    <filter id="shadow-wedding" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#735235" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- خلفية متدرجة عاجية دافئة -->
  <rect width="360" height="240" fill="url(#bg-wedding)"/>

  <!-- هالة ضوئية رقيقة -->
  <circle cx="180" cy="110" r="110" fill="url(#ring-glow)"/>

  <!-- لمعات وبريق في الخلفية -->
  <g fill="#dfb758" opacity="0.6">
    <path d="M70 60 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z"/>
    <path d="M280 50 l2.5 7 l7 2.5 l-7 2.5 l-2.5 7 l-2.5 -7 l-7 -2.5 l7 -2.5 z"/>
    <path d="M120 30 l1.5 4 l4 1.5 l-4 1.5 l-1.5 4 l-1.5 -4 l-4 -1.5 l4 -1.5 z"/>
    <circle cx="50" cy="130" r="3" fill="#e2c480"/>
    <circle cx="310" cy="110" r="3.5" fill="#e2c480"/>
  </g>

  <!-- تكوين الزفاف والخطوبة -->
  <g filter="url(#shadow-wedding)">
    <!-- أغصان الأوكالبتوس الخضراء المريمية في الخلف -->
    <g fill="#7b8e53" opacity="0.85">
      <path d="M110 160 Q80 120 90 90 Q105 110 115 145 Z"/>
      <circle cx="85" cy="100" r="8" fill="#8b9e62"/>
      <circle cx="95" cy="120" r="10" fill="#75884d"/>
      <path d="M250 160 Q280 120 270 90 Q255 110 245 145 Z"/>
      <circle cx="275" cy="100" r="8" fill="#8b9e62"/>
      <circle cx="265" cy="120" r="10" fill="#75884d"/>
    </g>

    <!-- باقة ورود العروس العاجية -->
    <!-- وردة بيضاء يسار -->
    <g transform="translate(145, 145)">
      <circle cx="0" cy="0" r="22" fill="url(#white-rose)"/>
      <circle cx="0" cy="0" r="15" fill="#f8ece5"/>
      <circle cx="0" cy="0" r="9" fill="#ecd3c5"/>
      <circle cx="0" cy="0" r="4" fill="#dfbeae"/>
    </g>

    <!-- وردة عاجية يمين -->
    <g transform="translate(215, 145)">
      <circle cx="0" cy="0" r="22" fill="url(#white-rose)"/>
      <circle cx="0" cy="0" r="15" fill="#f8ece5"/>
      <circle cx="0" cy="0" r="9" fill="#ecd3c5"/>
      <circle cx="0" cy="0" r="4" fill="#dfbeae"/>
    </g>

    <!-- وردة وردية رئيسية في المنتصف أسفل الخواتم -->
    <g transform="translate(180, 165)">
      <circle cx="0" cy="0" r="24" fill="url(#blush-rose)"/>
      <circle cx="0" cy="0" r="17" fill="#f3c5d1"/>
      <circle cx="0" cy="0" r="10" fill="#df97a8"/>
      <circle cx="0" cy="0" r="5" fill="#be667a"/>
    </g>

    <!-- براعم أزهار صغيرة وخرز لؤلؤ -->
    <g fill="#ffffff" stroke="#e8ded8" stroke-width="1">
      <circle cx="120" cy="175" r="5"/>
      <circle cx="132" cy="182" r="4"/>
      <circle cx="240" cy="175" r="5"/>
      <circle cx="228" cy="182" r="4"/>
    </g>

    <!-- شريط ساتان أبيض فاخر يربط الباقة -->
    <path d="M160 185 Q180 175 200 185 Q180 195 160 185 Z" fill="#ffffff" stroke="#e0d5ce" stroke-width="1"/>
    <path d="M165 190 Q155 215 140 225 M195 190 Q205 215 220 225" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M165 190 Q155 215 140 225 M195 190 Q205 215 220 225" stroke="#e8ded7" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- خاتما الزفاف المتداخلان المذهبان في المنتصف العلوي -->
    <!-- الخاتم الأول (يسار) -->
    <ellipse cx="165" cy="85" rx="26" ry="26" fill="none" stroke="url(#gold-grad)" stroke-width="6.5"/>
    <!-- لمعة الخاتم الأول -->
    <ellipse cx="152" cy="72" rx="4" ry="2" fill="#ffffff" opacity="0.9" transform="rotate(-40, 152, 72)"/>

    <!-- الخاتم الثاني متداخل (يمين) ومزين بماسة -->
    <ellipse cx="195" cy="85" rx="26" ry="26" fill="none" stroke="url(#gold-grad)" stroke-width="6.5"/>
    <!-- ألماسة الخاتم الثاني المتوهجة -->
    <g transform="translate(195, 54)">
      <!-- قاعدة الماسة -->
      <path d="M-6 6 L6 6 L4 11 L-4 11 Z" fill="url(#gold-grad)"/>
      <!-- فصوص الماسة البرّاقة -->
      <path d="M-9 6 L9 6 L12 0 L0 -10 L-12 0 Z" fill="#ffffff" stroke="#c9e8fb" stroke-width="0.8"/>
      <path d="M0 -10 L4 0 L-4 0 Z" fill="#e8f4fc" opacity="0.8"/>
      <path d="M4 0 L9 6 L0 6 Z" fill="#d0ebfa" opacity="0.7"/>
      <path d="M-4 0 L-9 6 L0 6 Z" fill="#d0ebfa" opacity="0.7"/>
      <!-- بريق الماسة الساطع -->
      <path d="M0 -14 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2 z" fill="#ffffff"/>
    </g>
  </g>
</svg>

