<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <radialGradient id="ie-rose-white" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8f4ee"/>
      <stop offset="85%" stop-color="#e8decb"/>
      <stop offset="100%" stop-color="#cfbe9f"/>
    </radialGradient>
    <radialGradient id="ie-tulip" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ded4be"/>
    </radialGradient>
    <linearGradient id="ie-wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#ede3d1"/>
    </linearGradient>
    <linearGradient id="ie-gold-ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#aa8323"/>
      <stop offset="100%" stop-color="#f7da79"/>
    </linearGradient>
    <linearGradient id="ie-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ba18b"/>
      <stop offset="100%" stop-color="#556e55"/>
    </linearGradient>
    <filter id="ie-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5a4e32" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#ie-shadow)">
    <!-- أوراق الأوكالبتوس المريمية الفضية -->
    <g fill="url(#ie-leaf)">
      <path d="M65 110 Q35 80 50 50 Q75 70 75 105 Z"/>
      <circle cx="48" cy="65" r="8" fill="#9db59d"/>
      <circle cx="58" cy="85" r="10" fill="#758c75"/>
      <path d="M175 110 Q205 80 190 50 Q165 70 165 105 Z"/>
      <circle cx="192" cy="65" r="8" fill="#9db59d"/>
      <circle cx="182" cy="85" r="10" fill="#758c75"/>
      <path d="M120 65 Q120 25 130 20 Q138 45 128 70 Z"/>
    </g>

    <!-- لآلئ بيضاء ناعمة -->
    <g fill="#ffffff" stroke="#e0d5be" stroke-width="1">
      <circle cx="68" cy="98" r="4.5"/><circle cx="78" cy="82" r="3.5"/><circle cx="62" cy="68" r="4"/>
      <circle cx="172" cy="98" r="4.5"/><circle cx="162" cy="82" r="3.5"/><circle cx="178" cy="68" r="4"/>
    </g>

    <!-- غلاف أبيض نقي مع طيات عاجية -->
    <polygon points="60,110 180,110 145,230 95,230" fill="#ede4d4"/>
    <polygon points="50,115 190,115 140,240 100,240" fill="url(#ie-wrap)"/>
    <path d="M50 115 Q90 135 120 240 L100 240 Z" fill="#ffffff" opacity="0.7"/>
    <path d="M190 115 Q150 135 120 240 L140 240 Z" fill="#dfd3bd" opacity="0.5"/>

    <!-- زهور أناقة العاج -->
    <!-- وردة عاجية يسار -->
    <g transform="translate(80, 105)">
      <circle cx="0" cy="0" r="23" fill="url(#ie-rose-white)"/>
      <circle cx="0" cy="0" r="16" fill="#f8f3e8"/>
      <circle cx="0" cy="0" r="10" fill="#e8dac1"/>
      <circle cx="0" cy="0" r="5" fill="#cbb795"/>
      <path d="M-8 -14 Q0 -22 8 -14" fill="none" stroke="#fff" stroke-width="1.8"/>
    </g>

    <!-- وردة عاجية يمين -->
    <g transform="translate(160, 105)">
      <circle cx="0" cy="0" r="23" fill="url(#ie-rose-white)"/>
      <circle cx="0" cy="0" r="16" fill="#f8f3e8"/>
      <circle cx="0" cy="0" r="10" fill="#e8dac1"/>
      <circle cx="0" cy="0" r="5" fill="#cbb795"/>
      <path d="M-8 -14 Q0 -22 8 -14" fill="none" stroke="#fff" stroke-width="1.8"/>
    </g>

    <!-- توليب أبيض علوي نضر -->
    <g transform="translate(120, 70)">
      <path d="M-16 16 C-24 -12 0 -25 0 -25 C0 -25 24 -12 16 16 C8 26 -8 26 -16 16 Z" fill="url(#ie-tulip)"/>
      <path d="M0 -22 C-6 -8 -4 14 0 18 C4 14 6 -8 0 -22 Z" fill="#ffffff" opacity="0.6"/>
      <path d="M-10 4 C-12 -6 -2 -14 0 -22" fill="none" stroke="#eadecb" stroke-width="1.2"/>
    </g>

    <!-- وردة جورية مركزية ملكية كبرى -->
    <g transform="translate(120, 118)">
      <circle cx="0" cy="0" r="27" fill="url(#ie-rose-white)"/>
      <circle cx="0" cy="0" r="19" fill="#fcf9f2"/>
      <circle cx="0" cy="0" r="12" fill="#ebdcc3"/>
      <circle cx="0" cy="0" r="6" fill="#baa47f"/>
      <path d="M-12 -12 Q0 -24 12 -12" fill="none" stroke="#fff" stroke-width="2.2"/>
      <path d="M-14 4 Q0 18 14 4" fill="none" stroke="#fff" stroke-width="1.8"/>
    </g>

    <!-- شريط ساتان ذهبي ملكي مع فيونكة أنيقة -->
    <g transform="translate(120, 205)">
      <ellipse cx="0" cy="0" rx="18" ry="7" fill="url(#ie-gold-ribbon)"/>
      <path d="M0 0 C-15 -18 -32 -6 -18 4 Z" fill="url(#ie-gold-ribbon)"/>
      <path d="M0 0 C15 -18 32 -6 18 4 Z" fill="url(#ie-gold-ribbon)"/>
      <circle cx="0" cy="0" r="4.5" fill="#ffffff"/>
      <path d="M-4 5 Q-14 26 -22 36 M4 5 Q14 26 22 36" stroke="url(#ie-gold-ribbon)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>

