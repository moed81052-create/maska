<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-birthday" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee8ee"/>
      <stop offset="50%" stop-color="#fad0dc"/>
      <stop offset="100%" stop-color="#f5b8c8"/>
    </linearGradient>
    <radialGradient id="cake-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fad0dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frosting" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faebf0"/>
    </linearGradient>
    <linearGradient id="cake-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eec2cd"/>
      <stop offset="100%" stop-color="#de9fb0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff9d00"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#fff4b8"/>
    </linearGradient>
    <linearGradient id="rose-petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f27d97"/>
      <stop offset="100%" stop-color="#c94464"/>
    </linearGradient>
    <filter id="shadow-bday" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#803348" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- خلفية متدرجة ناعمة -->
  <rect width="360" height="240" fill="url(#bg-birthday)"/>

  <!-- هالة ضوئية مركزية -->
  <circle cx="180" cy="130" r="100" fill="url(#cake-glow)"/>

  <!-- بالونات وقصاصات احتفالية في الخلفية -->
  <g opacity="0.45">
    <circle cx="60" cy="50" r="18" fill="#f898ad"/>
    <path d="M60 68 Q58 85 64 100" stroke="#d4798e" stroke-width="1.5" fill="none"/>
    <circle cx="85" cy="40" r="14" fill="#eed18a"/>
    <path d="M85 54 Q88 72 82 86" stroke="#cbb06d" stroke-width="1.5" fill="none"/>
    <circle cx="295" cy="48" r="16" fill="#a4b868"/>
    <path d="M295 64 Q292 80 297 95" stroke="#879953" stroke-width="1.5" fill="none"/>
  </g>

  <!-- قصاصات وزينة نجوم -->
  <g fill="#f19fb1" opacity="0.65">
    <path d="M120 40 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
    <path d="M245 45 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
    <circle cx="45" cy="120" r="4" fill="#e8c076"/>
    <circle cx="310" cy="120" r="3.5" fill="#f27d97"/>
    <circle cx="130" cy="70" r="3" fill="#8ba051"/>
    <circle cx="230" cy="65" r="4" fill="#eed18a"/>
  </g>

  <!-- حامل الكعكة والزهور -->
  <g filter="url(#shadow-bday)">
    <!-- طبق الكعكة -->
    <ellipse cx="180" cy="180" rx="90" ry="16" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="180" cy="178" rx="84" ry="13" fill="#faedf2"/>

    <!-- طبقة الكيك السفلية -->
    <path d="M115 145 Q115 170 180 170 Q245 170 245 145 L245 130 Q245 155 180 155 Q115 155 115 130 Z" fill="url(#cake-body)"/>

    <!-- طبقة الكيك الرئيسية -->
    <path d="M125 115 L125 140 Q125 160 180 160 Q235 160 235 140 L235 115 Z" fill="url(#cake-body)"/>
    <ellipse cx="180" cy="115" rx="55" ry="15" fill="url(#frosting)"/>

    <!-- كريمة متدلية مزخرفة -->
    <path d="M125 115 Q130 130 137 122 Q145 133 155 120 Q165 132 175 120 Q185 133 195 121 Q205 132 215 120 Q225 131 235 115" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- شمعة عيد الميلاد -->
    <rect x="176" y="78" width="8" height="30" rx="3" fill="#fff" stroke="#f0a8b9" stroke-width="1.5"/>
    <path d="M178 85 L182 89 M178 95 L182 99" stroke="#e87893" stroke-width="1.5"/>
    <!-- فتيل الشمعة -->
    <line x1="180" y1="78" x2="180" y2="72" stroke="#666" stroke-width="1.5"/>
    <!-- شعلة الشمعة المتوهجة -->
    <ellipse cx="180" cy="65" rx="6" ry="10" fill="url(#flame)"/>
    <ellipse cx="180" cy="66" rx="3" ry="6" fill="#ffffff"/>

    <!-- ورود طبيعية محيطة بالكعكة -->
    <!-- وردة يسار -->
    <g transform="translate(110, 160)">
      <circle cx="0" cy="0" r="16" fill="url(#rose-petal)"/>
      <circle cx="0" cy="0" r="11" fill="#ea6181"/>
      <circle cx="0" cy="0" r="7" fill="#c4385a"/>
      <circle cx="0" cy="0" r="3.5" fill="#f8b6c6"/>
      <path d="M-12 10 Q-24 16 -18 24 Q-8 22 -6 12 Z" fill="#7d8f43"/>
    </g>

    <!-- وردة يمين -->
    <g transform="translate(250, 158)">
      <circle cx="0" cy="0" r="17" fill="url(#rose-petal)"/>
      <circle cx="0" cy="0" r="12" fill="#ea6181"/>
      <circle cx="0" cy="0" r="7.5" fill="#c4385a"/>
      <circle cx="0" cy="0" r="4" fill="#f8b6c6"/>
      <path d="M12 10 Q24 16 18 24 Q8 22 6 12 Z" fill="#7d8f43"/>
    </g>

    <!-- وردة صغيرة في المنتصف -->
    <g transform="translate(180, 172)">
      <circle cx="0" cy="0" r="13" fill="#ffffff"/>
      <circle cx="0" cy="0" r="9" fill="#fae1e8"/>
      <circle cx="0" cy="0" r="5" fill="#ea809a"/>
      <path d="M-8 -6 Q-18 -12 -12 -2" fill="#8aa14b"/>
      <path d="M8 -6 Q18 -12 12 -2" fill="#8aa14b"/>
    </g>
  </g>
</svg>

