<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-thanks" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9ea"/>
      <stop offset="50%" stop-color="#feefcd"/>
      <stop offset="100%" stop-color="#fae0ab"/>
    </linearGradient>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fae3af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunflower-petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe169"/>
      <stop offset="60%" stop-color="#fca311"/>
      <stop offset="100%" stop-color="#e07a00"/>
    </linearGradient>
    <linearGradient id="seed-center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a4c28"/>
      <stop offset="50%" stop-color="#4a3319"/>
      <stop offset="100%" stop-color="#2a1d0d"/>
    </linearGradient>
    <linearGradient id="ribbon-olive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#808f3e"/>
      <stop offset="100%" stop-color="#556228"/>
    </linearGradient>
    <filter id="shadow-thanks" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#694f20" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- خلفية متدرجة ذهبية دافئة ومبهجة -->
  <rect width="360" height="240" fill="url(#bg-thanks)"/>

  <!-- هالة شمس دافئة في المركز -->
  <circle cx="180" cy="115" r="110" fill="url(#sun-glow)"/>

  <!-- خيوط أشعة شمس رقيقة ونجوم شكر -->
  <g stroke="#f0c660" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <line x1="180" y1="20" x2="180" y2="40"/>
    <line x1="110" y1="35" x2="125" y2="50"/>
    <line x1="250" y1="35" x2="235" y2="50"/>
    <line x1="60" y1="90" x2="80" y2="95"/>
    <line x1="300" y1="90" x2="280" y2="95"/>
  </g>

  <g fill="#e2a82b" opacity="0.7">
    <path d="M65 45 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
    <path d="M295 45 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
    <circle cx="45" cy="120" r="3.5"/>
    <circle cx="315" cy="120" r="3.5"/>
  </g>

  <!-- تكوين زهرة دوار الشمس وأزهار الشكر والامتنان -->
  <g filter="url(#shadow-thanks)">
    <!-- أغصان مريمية وخضار منسق في الخلف -->
    <g fill="#75884d" opacity="0.9">
      <path d="M100 160 Q70 125 78 95 Q95 115 105 145 Z"/>
      <path d="M260 160 Q290 125 282 95 Q265 115 255 145 Z"/>
    </g>

    <!-- زهرة بابونج بيضاء يسار -->
    <g transform="translate(115, 145)">
      <!-- بتلات بيضاء -->
      <g fill="#ffffff" stroke="#f0e2d1" stroke-width="0.8">
        <ellipse cx="0" cy="-18" rx="5" ry="11"/>
        <ellipse cx="13" cy="-13" rx="5" ry="11" transform="rotate(45, 13, -13)"/>
        <ellipse cx="18" cy="0" rx="5" ry="11" transform="rotate(90, 18, 0)"/>
        <ellipse cx="13" cy="13" rx="5" ry="11" transform="rotate(135, 13, 13)"/>
        <ellipse cx="0" cy="18" rx="5" ry="11"/>
        <ellipse cx="-13" cy="13" rx="5" ry="11" transform="rotate(45, -13, 13)"/>
        <ellipse cx="-18" cy="0" rx="5" ry="11" transform="rotate(90, -18, 0)"/>
        <ellipse cx="-13" cy="-13" rx="5" ry="11" transform="rotate(135, -13, -13)"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#fca311"/>
    </g>

    <!-- زهرة خوخية يمين تعبر عن التقدير -->
    <g transform="translate(245, 145)">
      <circle cx="0" cy="0" r="22" fill="#ffb085"/>
      <circle cx="0" cy="0" r="15" fill="#ffd1b5"/>
      <circle cx="0" cy="0" r="9" fill="#ff7f50"/>
      <circle cx="0" cy="0" r="4" fill="#d84315"/>
    </g>

    <!-- زهرة دوار الشمس الكبرى في المنتصف (رمز الإشراق والامتنان) -->
    <g transform="translate(180, 110)">
      <!-- بتلات دوار الشمس الخارجية (طبقة 1) -->
      <g fill="url(#sunflower-petal)" opacity="0.9">
        <ellipse cx="0" cy="-44" rx="9" ry="24"/>
        <ellipse cx="22" cy="-38" rx="9" ry="24" transform="rotate(30, 22, -38)"/>
        <ellipse cx="38" cy="-22" rx="9" ry="24" transform="rotate(60, 38, -22)"/>
        <ellipse cx="44" cy="0" rx="9" ry="24" transform="rotate(90, 44, 0)"/>
        <ellipse cx="38" cy="22" rx="9" ry="24" transform="rotate(120, 38, 22)"/>
        <ellipse cx="22" cy="38" rx="9" ry="24" transform="rotate(150, 22, 38)"/>
        <ellipse cx="0" cy="44" rx="9" ry="24"/>
        <ellipse cx="-22" cy="38" rx="9" ry="24" transform="rotate(30, -22, 38)"/>
        <ellipse cx="-38" cy="22" rx="9" ry="24" transform="rotate(60, -38, 22)"/>
        <ellipse cx="-44" cy="0" rx="9" ry="24" transform="rotate(90, -44, 0)"/>
        <ellipse cx="-38" cy="-22" rx="9" ry="24" transform="rotate(120, -38, -22)"/>
        <ellipse cx="-22" cy="-38" rx="9" ry="24" transform="rotate(150, -22, -38)"/>
      </g>
      <!-- بتلات داخلية متداخلة (طبقة 2) -->
      <g fill="#ffe066">
        <ellipse cx="0" cy="-34" rx="7" ry="18" transform="rotate(15, 0, -34)"/>
        <ellipse cx="24" cy="-24" rx="7" ry="18" transform="rotate(45, 24, -24)"/>
        <ellipse cx="34" cy="0" rx="7" ry="18" transform="rotate(75, 34, 0)"/>
        <ellipse cx="24" cy="24" rx="7" ry="18" transform="rotate(105, 24, 24)"/>
        <ellipse cx="0" cy="34" rx="7" ry="18" transform="rotate(135, 0, 34)"/>
        <ellipse cx="-24" cy="24" rx="7" ry="18" transform="rotate(165, -24, 24)"/>
        <ellipse cx="-34" cy="0" rx="7" ry="18" transform="rotate(15, -34, 0)"/>
        <ellipse cx="-24" cy="-24" rx="7" ry="18" transform="rotate(45, -24, -24)"/>
      </g>
      <!-- قلب زهرة دوار الشمس البني المزخرف -->
      <circle cx="0" cy="0" r="26" fill="url(#seed-center)"/>
      <circle cx="0" cy="0" r="22" fill="#52391c" stroke="#6b4a24" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="14" fill="#38250f"/>
    </g>

    <!-- شريط وبطاقة شكر "شكراً لك" أسفل الباقة -->
    <g transform="translate(180, 185)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="url(#ribbon-olive)"/>
      <circle cx="-28" cy="0" r="3.5" fill="#fdf0cd"/>
      <!-- خطوط زخرفة أنيقة -->
      <text x="5" y="5" font-family="'Cairo', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">شكر وتقدير</text>
    </g>
  </g>
</svg>

