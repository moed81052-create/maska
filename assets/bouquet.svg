<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="rp" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fbe3e8"/>
      <stop offset=".55" stop-color="#f1b9c4"/>
      <stop offset="1" stop-color="#e297a8"/>
    </radialGradient>
    <radialGradient id="rw" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f6eef0"/>
      <stop offset="1" stop-color="#e3d6da"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe4ea"/>
      <stop offset="1" stop-color="#f0c6d0"/>
    </linearGradient>
    <g id="rose">
      <circle r="20" fill="url(#rp)"/>
      <circle r="14" fill="none" stroke="#e8a2b2" stroke-width="1.4" opacity=".8"/>
      <circle r="9" fill="none" stroke="#dc8ea0" stroke-width="1.4" opacity=".8"/>
      <circle r="4.5" fill="#d98597" opacity=".8"/>
      <path d="M-16 -6 Q0 -22 16 -6" fill="none" stroke="#fff" stroke-width="1.2" opacity=".55"/>
    </g>
    <g id="wrose">
      <circle r="17" fill="url(#rw)"/>
      <circle r="11" fill="none" stroke="#dccdd2" stroke-width="1.3"/>
      <circle r="6" fill="none" stroke="#cdbac0" stroke-width="1.3"/>
      <circle r="2.5" fill="#c9b3ba"/>
    </g>
  </defs>
  <!-- sparkles -->
  <g fill="#d9899b">
    <path d="M160 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M30 70 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" opacity=".7"/>
    <circle cx="70" cy="22" r="2"/><circle cx="125" cy="18" r="1.6"/><circle cx="178" cy="78" r="1.6"/><circle cx="22" cy="100" r="1.4"/>
  </g>
  <!-- leaves -->
  <path d="M48 112 Q30 92 46 78 Q60 96 58 116z" fill="#9db07a"/>
  <path d="M152 112 Q170 92 154 78 Q140 96 142 116z" fill="#9db07a"/>
