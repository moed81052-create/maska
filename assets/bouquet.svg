  <use href="#rose" x="128" y="88"/>
  <use href="#rose" x="100" y="70"/>
  <use href="#rose" x="82" y="56"/>
  <use href="#rose" x="118" y="54"/>
  <use href="#wrose" x="148" y="104"/>
  <use href="#wrose" x="54" y="104"/>
  <use href="#rose" x="100" y="102"/>
  <!-- paper cone -->
  <path d="M40 112 L100 232 L160 112 Q100 128 40 112z" fill="url(#paper)" stroke="#e3a9b6" stroke-width="1.5"/>
  <path d="M40 112 L100 160 L160 112" fill="none" stroke="#e3a9b6" stroke-width="1.2" stroke-dasharray="3 4"/>
  <g fill="#e2a3b2"><circle cx="78" cy="140" r="1.6"/><circle cx="122" cy="146" r="1.6"/><circle cx="100" cy="184" r="1.6"/><circle cx="88" cy="200" r="1.4"/><circle cx="114" cy="196" r="1.4"/></g>
  <!-- bow -->
  <g fill="#cf8193">
    <path d="M100 168 Q78 150 72 166 Q70 184 100 172z"/>
    <path d="M100 168 Q122 150 128 166 Q130 184 100 172z"/>
    <path d="M97 172 L86 202 L92 200 L100 176z"/>
