<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <radialGradient id="rb-rose-velvet" cx="42%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="35%" stop-color="#c9184a"/>
      <stop offset="75%" stop-color="#800f2f"/>
      <stop offset="100%" stop-color="#4a0418"/>
    </radialGradient>
    <radialGradient id="rb-rose-purple" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0aaff"/>
      <stop offset="45%" stop-color="#9d4edd"/>
      <stop offset="80%" stop-color="#5a189a"/>
      <stop offset="100%" stop-color="#240046"/>
    </radialGradient>
    <linearGradient id="rb-dark-wrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2b35"/>
      <stop offset="50%" stop-color="#241920"/>
      <stop offset="100%" stop-color="#140c12"/>
    </linearGradient>
    <linearGradient id="rb-gold-trim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#99731a"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>
    <linearGradient id="rb-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#738743"/>
      <stop offset="100%" stop-color="#3a4819"/>
    </linearGradient>
    <filter id="rb-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4a0418" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#rb-shadow)">
    <!-- خضار ملكي وأوراق ذهبية في الخلفية -->
    <g fill="url(#rb-leaf)">
      <path d="M60 110 Q25 80 40 45 Q65 65 70 100 Z"/>
      <circle cx="40" cy="60" r="9" fill="#889e52"/>
      <circle cx="52" cy="80" r="11" fill="#586b2e"/>
      <path d="M180 110 Q215 80 200 45 Q175 65 170 100 Z"/>
      <circle cx="200" cy="60" r="9" fill="#889e52"/>
      <circle cx="188" cy="80" r="11" fill="#586b2e"/>
      <path d="M120 60 Q125 15 135 12 Q140 35 128 65 Z"/>
    </g>

    <!-- لمسات ونجوم ذهبية ملكية متناثرة -->
    <g fill="#dfb758" opacity="0.85">
      <path d="M70 70 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
      <path d="M175 70 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
      <path d="M125 35 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z"/>
      <circle cx="55" cy="95" r="3.5" fill="#e8c870"/>
      <circle cx="185" cy="95" r="3.5" fill="#e8c870"/>
    </g>

    <!-- غلاف أسود مخملي فاخر بحواف ذهبية ملكية -->
    <polygon points="60,110 180,110 145,230 95,230" fill="#1f141b"/>
    <polygon points="50,115 190,115 140,240 100,240" fill="url(#rb-dark-wrap)"/>
    <!-- حواف ذهبية رقيقة للغلاف -->
    <path d="M50 115 L100 240" stroke="url(#rb-gold-trim)" stroke-width="1.8"/>
    <path d="M190 115 L140 240" stroke="url(#rb-gold-trim)" stroke-width="1.8"/>
    <!-- طيات الغلاف الفاخرة -->
    <path d="M50 115 Q90 135 120 240 L100 240 Z" fill="#4d3643" opacity="0.45"/>
    <path d="M190 115 Q150 135 120 240 L140 240 Z" fill="#140b11" opacity="0.6"/>

    <!-- باقة الباقة الملكية -->
    <!-- وردة مخملية قرمزية داكنة يسار -->
    <g transform="translate(80, 108)">
      <circle cx="0" cy="0" r="23" fill="url(#rb-rose-velvet)"/>
      <circle cx="0" cy="0" r="16" fill="#a4133c"/>
      <circle cx="0" cy="0" r="10" fill="#590d22"/>
      <circle cx="0" cy="0" r="5" fill="#ff758f"/>
      <path d="M-8 -14 Q0 -22 8 -14" fill="none" stroke="#ffb3c1" stroke-width="1.6" opacity="0.6"/>
    </g>

    <!-- وردة أرجوانية ملكية يمين -->
    <g transform="translate(160, 108)">
      <circle cx="0" cy="0" r="23" fill="url(#rb-rose-purple)"/>
      <circle cx="0" cy="0" r="16" fill="#7b2cbf"/>
      <circle cx="0" cy="0" r="10" fill="#3c096c"/>
      <circle cx="0" cy="0" r="5" fill="#e0aaff"/>
      <path d="M-8 -14 Q0 -22 8 -14" fill="none" stroke="#fff" stroke-width="1.6" opacity="0.6"/>
    </g>

    <!-- وردة قرمزية علوية فاخرة -->
    <g transform="translate(120, 75)">
      <circle cx="0" cy="0" r="19" fill="url(#rb-rose-velvet)"/>
      <circle cx="0" cy="0" r="13" fill="#800f2f"/>
      <circle cx="0" cy="0" r="7" fill="#ff4d6d"/>
      <path d="M-7 -10 Q0 -16 7 -10" fill="none" stroke="#ffb3c1" stroke-width="1.6" opacity="0.7"/>
    </g>

    <!-- وردة ملكية كبرى مركزية -->
    <g transform="translate(120, 120)">
      <circle cx="0" cy="0" r="28" fill="url(#rb-rose-velvet)"/>
      <circle cx="0" cy="0" r="20" fill="#800f2f"/>
      <circle cx="0" cy="0" r="13" fill="#c9184a"/>
      <circle cx="0" cy="0" r="6" fill="#ff758f"/>
      <path d="M-13 -13 Q0 -25 13 -13" fill="none" stroke="#ffccd5" stroke-width="2.2" opacity="0.8"/>
      <path d="M-15 4 Q0 18 15 4" fill="none" stroke="#ffb3c1" stroke-width="1.8" opacity="0.65"/>
    </g>

    <!-- شريط ساتان ذهبي ملكي عريض -->
    <g transform="translate(120, 205)">
      <ellipse cx="0" cy="0" rx="20" ry="7.5" fill="url(#rb-gold-trim)"/>
      <path d="M0 0 C-16 -19 -35 -6 -20 5 Z" fill="url(#rb-gold-trim)"/>
      <path d="M0 0 C16 -19 35 -6 20 5 Z" fill="url(#rb-gold-trim)"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
      <circle cx="0" cy="0" r="2" fill="#99731a"/>
      <path d="M-5 5 Q-15 28 -24 38 M5 5 Q15 28 24 38" stroke="url(#rb-gold-trim)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
  </g>
</svg>

